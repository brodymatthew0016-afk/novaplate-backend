name: Scrape Dining Status

on:
  schedule:
    # Syncs each hall's upcoming hours; the API works out open/closed from
    # them. 10:00 and 16:00 UTC = 6am and noon Eastern (5am/11am in winter).
    - cron: '0 10 * * *'
    - cron: '0 16 * * *'
  workflow_dispatch: {}

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm install
      - run: node scrape-dining-status.js
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}